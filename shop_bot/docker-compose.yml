version: "3.9"

services:
  bot:
    build: .
    container_name: shapiyar_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    command: python run.py

  db:
    image: postgres:16-alpine
    container_name: shapiyar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopbot
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: shop_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shapiyar_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
